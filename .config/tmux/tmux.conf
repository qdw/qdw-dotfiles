# ~/.tmux.conf
# Adapted from a sample tmux.conf by Tyler Mulligan. Public domain.
#
# This configuration file binds many of the common GNU screen key bindings to
# appropriate tmux key bindings. Note that for some key bindings there is no
# tmux analogue and also that this set omits binding some commands available in
# tmux but not in screen.
#
# Note this is a good starting point but you should check out the man page
# for more configuration options if you really want to get more out of tmux.

tmux_conf_new_window_retain_current_path=true
tmux_conf_new_pane_retain_current_path=true

# set-option -wg automatic-rename on

# set -g default-terminal "alacritty" # requires terminfo edits

set -g history-limit 500000

# New tmux versions only
set -g history-file /Users/qweaver/.nested_tmux_history

set -g mode-keys vi

# Set the prefix to ^Q
unbind C-q
set -g prefix ^Q
bind q send-prefix

# Bounce C-Q C-Q to toggle between the two most recently visited buffers.
bind ^Q last-window

# Bind appropriate commands similar to screen.
# lockscreen ^X x
unbind ^X
bind ^X lock-server
unbind x
bind x lock-server
 
# screen ^C c
unbind ^C
bind ^C new-window
bind c new-window
 
# detach ^D d
unbind ^D
bind ^D detach
 
# displays *
unbind *
bind * list-clients
 
# next ^@ ^N sp n
unbind ^@
bind ^@ next-window
unbind ^N
bind ^N next-window
unbind " "
bind " " next-window
unbind n
bind n next-window
 
# title A
unbind A
bind A command-prompt "rename-window %%"
 
# other ^A
unbind ^A
bind ^A last-window
 
# prev ^H ^P p ^?
unbind ^H
bind ^H previous-window
unbind ^P
bind ^P previous-window
unbind p
bind p previous-window
unbind BSpace
bind BSpace previous-window
 
# windows ^W w
unbind ^W
bind ^W list-windows
unbind w
bind w list-windows
 
# quit \
unbind \
bind \ confirm-before "kill-server"
 
# kill K k
unbind K
bind K confirm-before "kill-window"
unbind k
bind k confirm-before "kill-window"
 
# redisplay ^L l
unbind ^L
bind ^L refresh-client
unbind l
bind l refresh-client
 
# More straight forward key bindings for splitting
unbind %
bind | split-window -h # split horizontally
bind - split-window -v # split vertically
bind v split-window -h # like emacs C-2
bind h split-window -v # like emacs C-3

# History
set -g history-limit 5000
 
# Terminal emulator window title
# set -g set-titles on
# set -g set-titles-string '#S:#I.#P #W'

set -as terminal-features "RGB"
set-environment -g COLORTERM "truecolor"

#### Window dressing (a.k.a. themes)

## Color guide

# ANSI color example
# set -g my-var '#[fg=green]'
#
# Truecolor example
# set -g my-var '#[fg=#00FF00'

## Status Bar theming

set -g status-bg black
set -g status-fg brightblack

# Highlight the active window
setw -g window-status-current-style "align=left bg=green, fg=black"

# Number windows starting from 1 (rather than the default, 0)
set -g base-index 1

# Refresh status bar contents (e.g., clock) every n seconds
set -g status-interval 60

# # Clock
# setw -g clock-mode-color cyan
# setw -g clock-mode-style 24
# set -g status-left '#[fg=#008000]#{session_name}#[default]'
# set -g status-right '#[fg=#008000]%Y-%m-%d %H:%M %z#[default]'
# set -g window-status-current-format '#[bg=cyan]#{window_name}#[default]'
# set -g window-status-format '#[fg=cyan]#{window_name}#[default]'
# set -g status-right '#[fg=cyan]%Y-%m-%d %H:%M %z#[default]'

# Clock at bottom right
# set -g status-right '#[fg=cyan]%Y-%m-%d %H:%M %z#[default]'
#

#### Random settings

# Don't notify me when other windows have output that I haven't seen
setw -g monitor-activity off
set -g visual-activity off
 
# Make C-c , work faster, so you don't have
# to wait between pressing c and ,
set -s escape-time 0

setw -g aggressive-resize on

################
# Mouse handling
################

# Allow mouse actions. This will break your terminal emulator's normal
# copy-and-paste feature. However:
#
# - If you're using some Linux terminal emulators, you can momentarily disable
#   this behavior by holding down the shift key.
# 
# - If you're using iTerm2 on OS X, you can momentarily disable this
#   this behavior by holding down the shift key.
#

# New tmux versions only
set -g mouse on

# + temporarily "zooms" a pane into its own window so you can use OS-native
# copy and paste without getting other panes' contents.
#
# - puts the window back where it was earlier.
# From http://tangledhelix.com/blog/2012/07/16/tmux-and-mouse-mode/
# and https://github.com/tangledhelix/dotfiles/blob/master/tmux.conf
# Used by permission.
unbind +
bind + \
    new-window -d -n tmux-zoom 'clear && echo TMUX ZOOM && read' \;\
    swap-pane -s tmux-zoom.0 \;\
    select-window -t tmux-zoom
unbind -
bind - \
  last-window \;\
  swap-pane -s tmux-zoom.0 \;\
  kill-window -t tmux-zoom

###############
# Miscellaneous
###############
  
# `+r reloads the configuration, handy
bind r source-file ~/.tmux.conf

# break-pane and join-pane
unbind b
bind b break-pane
unbind j
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
#bind-key j "join-pane -s !"

# next layout
unbind Space
bind Space next-layout
 
# " windowlist -b
unbind '"'
bind '"' choose-window

set-window-option -g automatic-rename off
